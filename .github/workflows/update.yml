name: Update AK node list

on:
  schedule:
    - cron: '0 */2 * * *'   # 每 2 小时一次（UTC 偶数点）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-ak-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 VPN Gate + 检测 + 生成清单
        run: node update.mjs
        # 节点域名 / UUID / 检测 Worker 地址：改 update.mjs 顶部「配置区」三行

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回写清单（保持仓库活跃，防止 60 天后定时被 GitHub 暂停）
        run: |
          mkdir -p data
          cp dist/ak.txt data/ak.txt
          cp dist/stats.json data/stats.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 更新节点清单 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
