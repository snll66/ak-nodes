name: Update AK node list

on:
  schedule:
    - cron: '0 */12 * * *'   # 每 12 小时（UTC 0/12 点 = 北京时间 8/20 点）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-ak-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 VPN Gate + 检测 + 生成清单
        run: node update.mjs
        env:
          # 以下三项可在仓库 Settings → Secrets and variables → Actions → Variables 里覆盖（不用改代码）
          CHECK_WORKER: ${{ vars.CHECK_WORKER || 'https://ak-check.class-40b.workers.dev/check?sstp=vpn:vpn@' }}
          AK_HOST: ${{ vars.AK_HOST || 'txs.mavita.kdns.fr' }}
          AK_UUID: ${{ vars.AK_UUID || '2523c510-9ff0-415b-9582-93949bfae7e3' }}
          CHECK_CONCURRENCY: '6'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 回写清单（保持仓库活跃，防止 60 天后定时被 GitHub 暂停）
        run: |
          mkdir -p data
          cp dist/ak.txt data/ak.txt
          cp dist/stats.json data/stats.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 更新节点清单 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
